<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GedeBook - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f0; /* Cozy light beige background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .cozy-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
    <script>
        // Updated: Removed alert() for direct redirection
        window.handleSignup = () => {
            // In a real app, this would involve Firebase authentication
            window.location.href = 'login.html'; 
        };
    </script>
</head>
<body>
    <div class="w-full max-w-sm p-8 bg-white rounded-xl cozy-shadow border border-stone-200 relative">
        
        <!-- Back Button -->
        <a href="index.html" class="absolute top-4 left-4 text-stone-500 hover:text-stone-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>

        <h2 class="text-3xl font-bold text-amber-800 text-center mb-6 pt-2">Sign Up</h2>
        
        <form onsubmit="event.preventDefault(); handleSignup();" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-stone-700 mb-1">Username</label>
                <input type="text" id="username" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 transition-shadow">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 transition-shadow">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 transition-shadow">
            </div>
            
            <button type="submit" class="w-full bg-amber-600 text-white p-3 rounded-lg font-semibold hover:bg-amber-700 transition-colors cozy-shadow mt-4">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-stone-500 mt-6">
            Already have an account? 
            <a href="login.html" class="text-amber-600 font-semibold hover:text-amber-700">
                Log In with an existing account
            </a>
        </p>
    </div>
</body>
</html>
