<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GedeBook - Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f0; /* Cozy light beige background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .cozy-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
    <script>
        const ADMIN_EMAIL = 'admin@gede.book';
        const ADMIN_PASSWORD = 'gebukinadmin'; // Used only for client-side comparison fallback if needed, but handled by API now
        
        // Helper function to store user session data
        const saveUserSession = (user) => {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userId', user.id);
            localStorage.setItem('userName', user.username);
            
            // Check for admin role
            if (user.role === 'admin') {
                localStorage.setItem('isAdmin', 'true');
            } else {
                localStorage.removeItem('isAdmin');
            }
            window.location.href = 'index.html';
        };

        // Function to handle standard user login
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }
            
            try {
                const response = await fetch('api.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    saveUserSession(result.user);
                } else {
                    alert(result.message || "Login failed. Check server status.");
                }

            } catch (error) {
                console.error("Login API error:", error);
                alert("Could not connect to the server. Check XAMPP and api.php.");
            }
        };

        // NEW function for quick admin access via prompt (still uses the API)
        window.handleAdminPromptLogin = async () => {
            const passwordAttempt = prompt("Enter Admin Password:");
            
            if (passwordAttempt === null || passwordAttempt === "") return;
            
            try {
                // Use the hardcoded admin credentials for this prompt path
                const response = await fetch('api.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: ADMIN_EMAIL, 
                        password: passwordAttempt 
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    saveUserSession(result.user);
                } else {
                    alert(result.message || "Incorrect password.");
                }

            } catch (error) {
                console.error("Admin Login API error:", error);
                alert("Could not connect to the server.");
            }
        };
    </script>
</head>
<body>
    <div class="w-full max-w-sm p-8 bg-white rounded-xl cozy-shadow border border-stone-200 relative">
        
        <!-- Back Button -->
        <a href="index.html" class="absolute top-4 left-4 text-stone-500 hover:text-stone-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>

        <h2 class="text-3xl font-bold text-amber-800 text-center mb-6 pt-2">Log In</h2>
        
        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 transition-shadow">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 transition-shadow">
            </div>
            
            <button type="submit" class="w-full bg-amber-600 text-white p-3 rounded-lg font-semibold hover:bg-amber-700 transition-colors cozy-shadow mt-4">
                Log In
            </button>
        </form>

        <p class="text-center text-sm text-stone-500 mt-6">
            Don't have an account? 
            <a href="signup.html" class="text-amber-600 font-semibold hover:text-amber-700">
                Sign Up to make a new account
            </a>
        </p>
        
        <!-- UPDATED: Admin Quick Access Link (No red, calls prompt function) -->
        <p class="text-center text-xs mt-4">
            <a 
                href="#" 
                onclick="event.preventDefault(); handleAdminPromptLogin();" 
                class="text-amber-500 hover:text-amber-600 font-semibold"
            >
                Log in as Admin
            </a>
        </p>
    </div>
</body>
</html>
