<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GedeBook - Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css" media="screen">
    <script type="text/javascript" src="js/loginScripts.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f0;
            min-height: 100vh;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-sm p-8 bg-white rounded-xl cozy-shadow border border-stone-200 relative">

        <a href="index.html" class="absolute top-4 left-4 text-stone-500 hover:text-stone-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>

        <h2 class="text-3xl font-bold text-amber-800 text-center mb-6 pt-2">Log In</h2>

        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-shadow outline-none">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-shadow outline-none">
            </div>

            <button type="submit" class="w-full bg-amber-600 text-white p-3 rounded-lg font-semibold hover:bg-amber-700 transition-colors cozy-shadow mt-4">
                Log In
            </button>
        </form>

        <p class="text-center text-sm text-stone-500 mt-6">
            Don't have an account?
            <a href="signup.html" class="text-amber-600 font-semibold hover:text-amber-700 transition-colors">
                Sign Up to make a new account
            </a>
        </p>

        <p class="text-center text-xs mt-4">
            <a href="#" onclick="event.preventDefault(); handleAdminPromptLogin();" class="text-amber-500 hover:text-amber-600 font-semibold transition-colors">
                Log in as Admin
            </a>
        </p>
    </div>
</body>

</html>
