<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GedeBook – Cozy Book Reviews</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/indexScripts.js" defer></script>
</head>

<body>

    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm cozy-shadow">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">

            <div class="flex items-center gap-3">
                <img
                    src="./images/logo.png"
                    alt="GedeBook Logo"
                    class="h-8 w-auto rounded-md shadow-md"
                    onerror="this.onerror=null;this.src='https://placehold.co/40x40/6d3d1e/ffffff?text=GB';"
                />
                <a href="index.html" class="text-3xl font-extrabold text-amber-800 tracking-wider">
                    GedeBook
                </a>
            </div>

            <nav id="header-nav" class="flex items-center gap-4"></nav>

        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <section class="mb-8 p-6 bg-stone-100/70 border border-stone-200 rounded-xl">
            <h2 class="text-2xl font-semibold text-stone-800 mb-2">
                Welcome to GedeBook!
            </h2>
            <p class="text-stone-600">
                Find your next great read and share your literary journey with a community of book lovers.
            </p>
        </section>

        <section class="mb-8 flex flex-col sm:flex-row gap-4">

            <div class="relative flex-grow">
                <input
                    id="search-input"
                    type="text"
                    placeholder="Search by title, author, or reviewer..."
                    class="w-full py-3 pl-12 border border-stone-300 rounded-lg cozy-shadow focus:ring-amber-500 focus:border-amber-500"
                    oninput="updateDisplay()"
                />
                <svg
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-stone-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>

            <select
                id="star-filter"
                class="w-full sm:w-48 p-3 border border-stone-300 rounded-lg cozy-shadow bg-white focus:ring-amber-500 focus:border-amber-500"
                onchange="updateDisplay()"
            >
                <option value="0">Rating: All</option>
                <option value="5">★★★★★ (5 Stars)</option>
                <option value="4">★★★★☆ (4 Stars)</option>
                <option value="3">★★★☆☆ (3 Stars)</option>
                <option value="2">★★☆☆☆ (2 Stars)</option>
                <option value="1">★☆☆☆☆ (1 Star)</option>
            </select>

        </section>

        <section
            id="review-cards-container"
            class="grid grid-cols-2 md:grid-cols-3 gap-6"
        ></section>

        <div class="h-20"></div>
    </main>

    <div
        id="review-modal"
        class="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center hidden"
        onclick="if(event.target.id==='review-modal') hideModal()"
    >
        <div
            id="modal-container"
            class="bg-white w-full max-w-lg mx-4 rounded-xl cozy-shadow transform transition-all scale-95 opacity-0"
        >
            <div id="modal-content"></div>
        </div>
    </div>

    <div
        id="message-box"
        class="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-3 bg-amber-600 text-white rounded-lg cozy-shadow hidden opacity-0"
        role="alert"
    ></div>

</body>
</html>
