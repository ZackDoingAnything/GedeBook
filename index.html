<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GedeBook - Cozy Book Reviews</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the cozy aesthetic */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f0; /* Cozy light beige background */
        }
        .scroll-hidden::-webkit-scrollbar {
            display: none;
        }
        .scroll-hidden {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .cozy-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* New: Deeper shadow for the 'book cover' image to make it pop */
        .cozy-book-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06), 4px 4px 10px rgba(0, 0, 0, 0.2);
        }
        /* Style for the search input to push text right of the icon */
        #search-input {
            padding-left: 3rem; /* Make space for the icon */
        }
    </style>
    <script>
        // Mock data for the book reviews
        const reviewsData = [
            { id: 1, title: "The Silent Patient", author: "Alex Michaelides", stars: 5, snippet: "A truly gripping psychological thriller that kept me guessing until the very last page...", fullReview: "The Silent Patient is a masterpiece of suspense. The narrative structure, slowly peeling back layers of Theo Faber's life and his patient Alicia Berenson's silence, is brilliantly executed. The twist is genuinely earned and makes you want to re-read the entire book immediately to spot the subtle clues. Highly recommended for anyone who loves dark, character-driven stories. It addresses themes of trauma, obsession, and the thin line between therapy and madness in a compelling way.", imageBg: "bg-amber-800/40", reviewer: "Alice K." },
            { id: 2, title: "Project Hail Mary", author: "Andy Weir", stars: 5, snippet: "Ryland Grace. It's time to save the world! This book is pure, optimistic sci-fi joy.", fullReview: "Andy Weir does it again. This book is a perfect blend of high-stakes science, humor, and a genuinely lovable protagonist. The concept is inventive, the science is digestible yet fascinating, and the relationship between Grace and Rocky is genuinely touching. It’s an easy five stars and a must-read for fans of *The Martian*.", imageBg: "bg-blue-800/40", reviewer: "Benoit L." },
            { id: 3, title: "The Seven Husbands of Evelyn Hugo", author: "Taylor Jenkins Reid", stars: 4, snippet: "Hollywood glamour, secrets, and a lifetime of dramatic choices. An absolute page-turner.", fullReview: "Evelyn Hugo is an unforgettable character. Her story is layered, heartbreaking, and ultimately triumphant. The novel cleverly explores celebrity culture, ambition, and unconditional love through the lens of a fictional Hollywood icon. While the ending felt slightly rushed, the journey was magnificent and deeply moving. A solid four out of five stars.", imageBg: "bg-pink-800/40", reviewer: "Carla D." },
            { id: 4, title: "Where the Crawdads Sing", author: "Delia Owens", stars: 4, snippet: "Beautiful prose describing the marshlands and a gripping mystery at its heart. Loved the setting.", fullReview: "The setting in the North Carolina marsh is so vividly described it feels like a character itself. The story masterfully weaves together a coming-of-age narrative with a murder mystery, exploring themes of abandonment and natural survival. A powerful, if occasionally slow-paced, debut. Recommended for literary fiction lovers.", imageBg: "bg-green-800/40", reviewer: "David M." },
            { id: 5, title: "Dune", author: "Frank Herbert", stars: 5, snippet: "An epic masterpiece of sci-fi, politics, and ecology. Long live the fighters!", fullReview: "Dune is not just a book; it's a foundational text for modern science fiction. The complexity of the world-building, the religious and political commentary, and the sheer scope of the story are unparalleled. It requires attention, but the payoff is immense. A timeless classic that remains a five-star read.", imageBg: "bg-red-800/40", reviewer: "Emily F." },
            { id: 6, title: "Circe", author: "Madeline Miller", stars: 5, snippet: "A mesmerizing retelling of the Greek myth. Circe finally gets the voice she deserves.", fullReview: "Madeline Miller's prose is lyrical and immersive. Taking a minor figure from Greek mythology and giving her a complex, centuries-spanning life story is a feat of storytelling. The book is about self-discovery, motherhood, and power. It's a beautifully crafted, emotionally resonant novel.", imageBg: "bg-indigo-800/40", reviewer: "Frank G." },
        ];

        // Utility function to generate star icons
        const getStarsHtml = (count) => {
            const fullStar = '<span class="text-amber-500">★</span>';
            const emptyStar = '<span class="text-gray-300">★</span>';
            return fullStar.repeat(count) + emptyStar.repeat(5 - count);
        };

        const renderCards = (filteredReviews) => {
            const container = document.getElementById('review-cards-container');
            if (!container) return;
            
            // Handle case where filteredReviews is undefined or empty
            const reviewsToRender = filteredReviews || reviewsData;

            if (reviewsToRender.length === 0) {
                 container.innerHTML = `
                    <div class="col-span-full p-8 text-center bg-white/70 rounded-xl border border-stone-200 text-stone-600">
                        <p class="text-xl font-semibold mb-2">No Reviews Found</p>
                        <p>Try adjusting your search terms or minimum rating filter.</p>
                    </div>
                 `;
                 return;
            }

            container.innerHTML = reviewsToRender.map(review => `
                <div 
                    class="review-card bg-white rounded-xl cozy-shadow transition-all duration-300 hover:cozy-shadow hover:scale-[1.01] cursor-pointer flex flex-col"
                    data-id="${review.id}"
                    onclick="showModal(${review.id})"
                >
                    <!-- Card Content Container - Always flex-col (stacked) -->
                    <div class="p-4 flex flex-col gap-3 h-full">
                        
                        <!-- 1: Title and Author (Placed at the top) -->
                        <div class="text-center">
                            <h2 class="text-xl font-bold text-stone-800 leading-tight">${review.title}</h2>
                            <p class="text-sm text-stone-500 font-medium italic">by ${review.author}</p>
                        </div>

                        <!-- 2: Book Image Placeholder (Fixed Portrait Size, Centered) -->
                        <div class="flex-shrink-0 w-32 h-48 rounded-lg ${review.imageBg} flex items-center justify-center border border-gray-100 cozy-book-shadow mx-auto">
                            <svg class="w-10 h-10 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        
                        <!-- 3: Text Content Block (Stars, Snippet, Button) -->
                        <div class="flex-grow flex flex-col">
                            <div>
                                
                                <!-- Stars -->
                                <div class="mb-3 text-lg">${getStarsHtml(review.stars)}</div>
                                
                                <!-- Review Snippet -->
                                <p class="text-base text-stone-600 line-clamp-3 mb-4">
                                    <span class="font-semibold text-stone-700">Reviewer: ${review.reviewer}</span> — ${review.snippet}
                                </p>
                            </div>
                            
                            <!-- Read More link - Pushed to bottom of the card content area -->
                            <p class="mt-auto text-sm text-amber-600 hover:text-amber-700 font-semibold transition-colors duration-200">
                                Click to read full review &rarr;
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // Function to handle filtering and then rendering
        window.updateDisplay = () => {
            const searchInput = document.getElementById('search-input');
            const starFilter = document.getElementById('star-filter');
            
            if (!searchInput || !starFilter) {
                // If elements aren't ready, just render all reviews
                renderCards(reviewsData);
                return;
            }

            const searchTerm = searchInput.value.toLowerCase();
            const minStars = parseInt(starFilter.value, 10);

            // 1. Filter Logic
            const filteredReviews = reviewsData.filter(review => {
                const searchArea = `${review.title} ${review.author} ${review.reviewer}`.toLowerCase();
                const matchesSearch = searchArea.includes(searchTerm);
                const matchesRating = review.stars >= minStars;

                return matchesSearch && matchesRating;
            });
            
            // 2. Render Cards
            renderCards(filteredReviews);
        };
        
        // Modal functions
        window.showModal = (id) => {
            const review = reviewsData.find(r => r.id === id);
            if (!review) return;

            const modal = document.getElementById('review-modal');
            const modalContainer = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            
            if (!modal || !modalContainer || !content) return; // Safety check

            content.innerHTML = `
                <!-- Modal Header: Contains Title and Author -->
                <div class="p-6 md:p-8 border-b border-stone-100 flex items-start justify-between">
                    <div>
                        <h3 class="text-3xl font-bold text-stone-800 mb-1">${review.title}</h3>
                        <p class="text-lg text-stone-500 italic">by ${review.author}</p>
                    </div>
                    <button class="text-stone-400 hover:text-stone-700 transition-colors" onclick="hideModal()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 md:p-8 scroll-hidden overflow-y-auto max-h-[70vh]">

                    <!-- 1. Book Image Placeholder (MOVED HERE: Under Author) -->
                    <div class="mb-8 h-64 w-40 mx-auto rounded-lg ${review.imageBg} opacity-50 flex items-center justify-center text-xl text-white font-semibold italic cozy-book-shadow">
                        "A Book's Journey"
                    </div>

                    <!-- 2. Metadata (Reviewer and Stars) -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 pb-4 border-b border-stone-100">
                         <div class="mb-2 sm:mb-0">
                            <span class="text-base font-semibold text-stone-700">Reviewer:</span>
                            <span class="text-base text-amber-600 ml-1">${review.reviewer}</span>
                        </div>
                        <div class="text-xl">${getStarsHtml(review.stars)}</div>
                    </div>

                    <!-- 3. Full Review Text -->
                    <p class="text-lg text-stone-600 whitespace-pre-wrap leading-relaxed">${review.fullReview}</p>
                    
                </div>
            `;

            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                // Ensure the inner container becomes visible
                modalContainer.classList.remove('scale-95', 'opacity-0');
                modalContainer.classList.add('scale-100', 'opacity-100');
            }, 10); 
            document.body.classList.add('overflow-hidden');
        };

        window.hideModal = () => {
            const modal = document.getElementById('review-modal');
            const modalContainer = document.getElementById('modal-container');

            if (!modal || !modalContainer) return;

            // Start exit animation
            modalContainer.classList.remove('scale-100', 'opacity-100');
            modalContainer.classList.add('scale-95', 'opacity-0');
            
            // Wait for the transition to finish before hiding the container
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            }, 300); 
        };
        
        // Initial call to render the cards (now updateDisplay)
        document.addEventListener('DOMContentLoaded', window.updateDisplay);
    </script>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="bg-white/95 sticky top-0 z-20 cozy-shadow backdrop-blur-sm">
        <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-amber-800 tracking-wider">
                GedeBook
            </h1>
            <nav>
                <a href="#" class="text-stone-600 hover:text-amber-700 font-medium transition-colors ml-4 sm:ml-6">Home</a>
                <a href="#" class="text-stone-600 hover:text-amber-700 font-medium transition-colors ml-4 sm:ml-6">My Feed</a>
                <button class="bg-amber-600 text-white px-4 py-2 rounded-lg ml-4 sm:ml-6 text-sm font-semibold hover:bg-amber-700 transition-colors cozy-shadow">
                    Post Review
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto py-8 px-4">
        
        <!-- Welcome Message -->
        <section class="mb-8 p-6 bg-stone-100/70 rounded-xl border border-stone-200">
            <h2 class="text-2xl font-semibold text-stone-800 mb-2">Welcome to GedeBook!</h2>
            <p class="text-stone-600">Find your next great read and share your literary journey with a community of book lovers. Dive into the latest reviews below.</p>
        </section>

        <!-- Filter and Search Controls (New Section) -->
        <section class="mb-8 flex flex-col sm:flex-row gap-4">
            <!-- Search Bar (Now wrapped in a relative container with an icon) -->
            <div class="relative flex-grow">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search by title, author, or reviewer..."
                    class="w-full p-3 border border-stone-300 rounded-lg cozy-shadow focus:ring-amber-500 focus:border-amber-500 transition-shadow"
                    oninput="updateDisplay()"
                >
                <!-- Search Icon (SVG) -->
                <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            
            <!-- Dropdown Filter (Min Stars) -->
            <select 
                id="star-filter" 
                class="w-full sm:w-48 p-3 border border-stone-300 rounded-lg cozy-shadow bg-white focus:ring-amber-500 focus:border-amber-500 transition-shadow"
                onchange="updateDisplay()"
            >
                <option value="0">Min Rating: All</option>
                <option value="5">★★★★★ (5 Stars)</option>
                <option value="4">★★★★☆ (4+ Stars)</option>
                <option value="3">★★★☆☆ (3+ Stars)</option>
            </select>
        </section>

        <!-- Review Card List - Updated responsive grid: 2 on mobile (default), 3 on tablet (md), 3 on desktop (lg) -->
        <section id="review-cards-container" class="grid grid-cols-2 gap-6 md:grid-cols-3 lg:grid-cols-3">
            <!-- Cards will be injected here by JavaScript -->
        </section>
        
        <!-- Footer Spacer -->
        <div class="h-16"></div>
    </main>

    <!-- Full Review Modal (Hidden by default) -->
    <!-- The onclick handler allows clicking the overlay to close the modal -->
    <div id="review-modal" class="fixed inset-0 z-50 bg-stone-900 bg-opacity-50 flex items-center justify-center hidden" onclick="if(event.target.id === 'review-modal') hideModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 cozy-shadow transform transition-all duration-300 scale-95 opacity-0" id="modal-container">
            <!-- Modal Content will be injected here -->
            <div id="modal-content"></div>
        </div>
    </div>
</body>
</html>
